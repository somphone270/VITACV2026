{% load static %}
<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | VVC</title>
  
  <!-- Google Fonts: Noto Sans Lao -->
  <link href="https://googleapis.com" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #4a90e2;
      --primary-hover: #357abd;
      --bg-dark: #0f172a;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans Lao', sans-serif;
    }

    body.login {
      background-color: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Background Animation Area */
    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Glassmorphic Login Box */
    .login-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      margin: 20px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .logo-wrapper {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px auto;
      background: rgba(255, 255, 255, 0.9);
      padding: 12px;
      border-radius: 50%;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    h2 {
      color: var(--text-main);
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 5px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 25px;
    }

    /* Input Styling */
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    /* ບັງຄັບຈັດການ Style ໃຫ້ Input ຂອງ Django */
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.25);
      background: rgba(15, 23, 42, 0.8);
    }

    /* ປຸ່ມ ສະແດງ/ຊ່ອນ ລະຫັດຜ່ານ */
    .toggle-password {
      position: absolute;
      right: 12px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 13px;
      background: rgba(255,255,255,0.05);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      user-select: none;
      transition: all 0.2s;
    }

    .toggle-password:hover {
      color: #fff;
      background: rgba(255,255,255,0.15);
    }

    /* Button Login */
    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary-color), #2575fc);
      border: none;
      border-radius: 12px;
      color: #white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 117, 252, 0.3);
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 117, 252, 0.5);
      opacity: 0.95;
    }

    /* Error Alert */
    .error-alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    /* Footer Back Link */
    .back-link {
      margin-top: 25px;
    }

    .back-link a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .back-link a:hover {
      color: var(--text-main);
    }
  </style>

  <!-- Particles.js -->
  <script src="https://jsdelivr.net"></script>
</head>
<body class="login">

  <div id="particles-js"></div>

  <div class="login-container">
    <div class="logo-wrapper">
      <img src="{% static 'images/LOGO.png' %}" alt="Logo" />
    </div>
    <h2>Vita Vocational College</h2>
    <div class="subtitle">ລະບົບຈັດການຂໍ້ມູນ ແລະ ຜູ້ດູແລ</div>

    <!-- ສ່ວນສະແດງ Error -->
    {% if form.errors or form.non_field_errors %}
    <div class="error-alert">
        ⚠️ ຊື່ຜູ້ໃຊ້ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ!
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      
      <div class="form-group">
        <label for="id_username">ຊື່ຜູ້ໃຊ້ (Username):</label>
        {{ form.username }}
      </div>
      
      <div class="form-group">
        <label for="id_password">ລະຫັດຜ່ານ (Password):</label>
        <div class="input-wrapper">
          {{ form.password }}
          <span onclick="togglePassword()" id="toggle-icon" class="toggle-password">
            👁️ ສະແດງ
          </span>
        </div>
      </div>
      
      <button type="submit">ເຂົ້າສູ່ລະບົບ (Log In)</button>
    </form>

    <div class="back-link">
       <a href="{% url 'home' %}">← ກັບສູ່ໜ້າຫຼັກ (返回首页)</a>
    </div>
  </div>

  <!-- Script ສໍາລັບ ສະແດງ/ຊ່ອນ ລະຫັດຜ່ານ -->
  <script>
    function togglePassword() {
      var passwordField = document.getElementById("id_password") || document.querySelector("input[type='password']") || document.querySelector("input[name='password']");
      var toggleIcon = document.getElementById("toggle-icon");
      
      if (passwordField) {
        if (passwordField.type === "password") {
          passwordField.type = "text";
          toggleIcon.innerHTML = "🙈 ຊ່ອນ";
        } else {
          passwordField.type = "password";
          toggleIcon.innerHTML = "👁️ ສະແດງ";
        }
      }
    }
  </script>

  <!-- Gear animation Config ປັບໃຫ້ເຟືອງໝູນເນຽນຕາຂຶ້ນ -->
  <script>
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 30, "density": { "enable": true, "value_area": 800 } },
        "shape": {
          "type": "image",
          "image": {
            "src": "{% static 'images/gear-white.png' %}",
            "width": 24,
            "height": 24
          }
        },
        "opacity": { "value": 0.25, "random": true },
        "size": { "value": 16, "random": true },
        "move": { "enable": true, "speed": 1, "out_mode": "out" }
      },
      "interactivity": { "events": { "onhover": { "enable": true, "mode": "repulse" } } },
      "retina_detect": true
    });
  </script>

</body>
</html>
