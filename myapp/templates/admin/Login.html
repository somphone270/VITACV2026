{% load static %}
<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | VVC</title>
  
  <!-- 1. ປັບ Font ໃຫ້ໂຫຼດໄວຂຶ້ນແບບພິເສດ (Preconnect) -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap" media="print" onload="this.media='all'">
  
  <style>
    :root {
      --primary-color: #4a90e2;
      --primary-hover: #357abd;
      --bg-dark: #0f172a;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* ໃຊ້ຟອນລະບົບກ່ອນໃນລະຫວ່າງທີ່ລໍຖ້າ Font ລາວ ໂຫຼດ ເພື່ອບໍ່ໃຫ້ເວັບຄ້າງ */
      font-family: 'Noto Sans Lao', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body.login {
      background-color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .login-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      margin: 20px;
      background: rgb(2, 60, 250);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(255, 255, 255, 0.986);
      text-align: center;
    }

    .logo-wrapper {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px auto;
      background: rgba(255, 255, 255, 0.9);
      padding: 12px;
      border-radius: 50%;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    h2 {
      color: var(--text-main);
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(208, 210, 212, 0.822);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--primary-color);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn-login:hover {
      background: var(--primary-hover);
    }

    .messages {
      list-style: none;
      margin-bottom: 20px;
      padding: 10px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 14px;
    }
  </style>
</head>
<body class="login">

  <div id="particles-js"></div>

  <div class="login-container">
    <div class="logo-wrapper">
      <img src="{% static 'images/logo.png' %}" alt="VVC Logo" width="66" height="66">
    </div>
    
    <h2>ເຂົ້າສູ່ລະບົບ</h2>
    <p class="subtitle">ຍິນດີຕ້ອນຮັບເຂົ້າສູ່ລະບົບ VVC</p>

    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    <form method="POST" action="">
      {% csrf_token %}
      <div class="form-group">
        <label for="username"><b>ຊື່ຜູ້ໃຊ້ງານ</b></label>
        <div class="input-wrapper">
          <input type="text" id="username" name="username" placeholder="ປ້ອນຊື່ຜູ້ໃຊ້ງານຂອງທ່ານ" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password"><b>ລະຫັດຜ່ານ</b></label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" placeholder="ປ້ອນລະຫັດຜ່ານ" required>
        </div>
      </div>

      <button type="submit" class="btn-login">ເຂົ້າສູ່ລະບົບ</button>
    </form>
  </div>

  <!-- 2. ໃສ່ defer ເພື່ອໂຫຼດ Script ພື້ນຫຼັງຫຼັງຈາກໂຫຼດໜ້າເວັບແລ້ວ (ບໍ່ດຶງໃຫ້ເວັບຊ້າ) -->
  <script src="https://jsdelivr.net" defer></script>
  <script>
    // ລໍຖ້າໃຫ້ Script ໂຫຼດສຳເລັດກ່ອນ ຈຶ່ງເລີ່ມເຮັດວຽກ
    window.addEventListener('DOMContentLoaded', () => {
      if(typeof particlesJS !== 'undefined') {
        particlesJS('particles-js', {
          "particles": {
            "number": { "value": 30, "density": { "enable": true, "value_area": 800 } },
            "color": { "value": "#ffffff" },
            "opacity": { "value": 0.1 },
            "size": { "value": 3 },
            "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.05, "width": 1 },
            "move": { "enable": true, "speed": 1 }
          }
        });
      }
    });
  </script>
</body>
</html>
