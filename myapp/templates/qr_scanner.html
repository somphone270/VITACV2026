{% extends 'components/base.html' %}
{% load static %}
{% block site_title %}ສະແກນກວດສອບ | VVC{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 30px auto; padding: 20px; font-family: 'Noto Sans Lao', sans-serif;">
    <div style="background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center;">
        
        <h2 style="color: #2c3e50; margin-bottom: 5px; font-size: 22px;">📷 ລະບົບສະແກນກວດສອບການລົງທະບຽນ</h2>
        <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 25px;">扫码 verify 登记信息</p>

        <!-- ປຸ່ມກົດຖ່າຍຮູບ ຫຼື ເລືອກໄຟລ໌ຮູບ QR -->
        <div style="margin: 10px auto; max-width: 400px;">
            <input type="file" id="qr-input-file" accept="image/*" capture="environment" style="display: none;" onchange="processQRImage(this)">
            <button onclick="document.getElementById('qr-input-file').click()" style="width: 100%; padding: 16px; background-color: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(40,167,69,0.2); display: flex; align-items: center; justify-content: center; gap: 10px;">
                📸 ເປີດກ້ອງຖ່າຍຮູບ QR Code
            </button>
        </div>

        <!-- ຫຼອດໂຫຼດເວລາປະມວນຜົນຮູບພາບ -->
        <div id="loading-status" style="display: none; margin-top: 15px; color: #007bff; font-weight: bold; font-size: 14px;">
            ⏳ ກຳລັງປະມວນຜົນ ແລະ ຖອດລະຫັດຮູບພາບ...
        </div>

        <!-- ກ່ອງສະແດງຜົນການກວດສອບ -->
        <div id="result-box" style="display: none; margin-top: 25px; padding: 25px; border-radius: 12px; text-align: left; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); transition: all 0.3s;">
            <h3 id="result-title" style="margin-top: 0; text-align: center; font-size: 18px; font-weight: bold;"></h3>
            
            <div style="display: flex; gap: 20px; align-items: center; margin-top: 20px; background: rgba(255,255,255,0.7); padding: 15px; border-radius: 8px;">
                <img id="student-img" src="" style="width: 100px; height: 130px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; display: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                <div style="font-size: 15px; color: #333; line-height: 1.8;">
                    <p style="margin: 5px 0;"><strong>ຊື່ ແລະ ນາມສະກຸນ:</strong> <span id="student-name" style="color: #000; font-weight: 500;"></span></p>
                    <p style="margin: 5px 0;"><strong>ສະຖານະ:</strong> <span id="student-status" style="color: #000; font-weight: 500;"></span></p>
                </div>
            </div>
            
            <button onclick="restartScanner()" style="width: 100%; margin-top: 20px; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; box-shadow: 0 4px 10px rgba(0,123,255,0.2);">
                🔄 ກົດເພື່ອສະແກນຕໍ່ (继续扫码)
            </button>
        </div>

    </div>
</div>

<!-- ໂຫຼດ Library jsQR ທີ່ສະແກນຮູບພາບໄດ້ແມ້ນຢໍາ -->
<script src="https://jsdelivr.net"></script>

<script>
function processQRImage(input) {
    if (!input.files || !input.files[0]) return;
    
    const file = input.files[0];
    const loadingStatus = document.getElementById('loading-status');
    loadingStatus.style.display = 'block';
    document.getElementById('result-box').style.display = 'none';

    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            // ສ້າງ Canvas ເພື່ອດຶງຂໍ້ມູນພິກເຊວຢ່າງຖືກຕ້ອງ
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // ກໍານົດຂະໜາດຮູບໃຫ້ເໝາະສົມ (Max 800px) ເພື່ອໃຫ້ສະແກນໄວຂຶ້ນ
            const maxDimension = 800;
            let width = img.width;
            let height = img.height;
            
            if (width > height) {
                if (width > maxDimension) {
                    height *= maxDimension / width;
                    width = maxDimension;
                }
            } else {
                if (height > maxDimension) {
                    width *= maxDimension / height;
                    height = maxDimension;
                }
            }
            
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            
            // ດຶງຂໍ້ມູນພິກເຊວໄປໃຫ້ Library jsQR ວິເຄາະ
            const imageData = ctx.getImageData(0, 0, width, height);
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
            });
            
            loadingStatus.style.display = 'none';
            
            if (code && code.data) {
                // ສະແກນສໍາເລັດ ➔ ສົ່ງຄ່າໄປກວດສອບກັບ Django API
                onScanSuccess(code.data);
            } else {
                alert("❌ ບໍ່ສາມາດອ່ານ QR Code ໄດ້!\n\nແນະນໍາ:\n1. ຕອນຖ່າຍຮູບ ໃຫ້ຂຍັບກ້ອງອອກຫ່າງປະມານ 1 ຄືບ ເພື່ອໃຫ້ພາບ QR ແຈ້ງ ແລະ ບໍ່ເບຼີ.\n2. ຫ້າມໃຫ້ມີແສງໄຟສະທ້ອນຂາວໆ ບັງຈຸດດຳຂອງ QR Code.");
                input.value = ""; 
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function onScanSuccess(decodedText) {
    let registrationId = decodedText.trim();
    
    // ເອີ້ນໃຊ້ Django API
    fetch(`/api/check-reg/${registrationId}/`)
    .then(response => response.json())
    .then(data => {
        let resultBox = document.getElementById('result-box');
        let resultTitle = document.getElementById('result-title');
        let studentName = document.getElementById('student-name');
        let studentStatus = document.getElementById('student-status');
        let studentImg = document.getElementById('student-img');
        
        resultBox.style.display = 'block';
        
        if (data.success) {
            resultBox.style.backgroundColor = '#e6f4ea';
            resultBox.style.border = '2px solid #34a853';
            resultTitle.innerHTML = '✅ ກວດສອບຜ່ານ (Verification Passed)';
            resultTitle.style.color = '#137333';
            
            studentName.innerText = data.name;
            studentStatus.innerText = data.status;
            
            if (data.image_url) {
                studentImg.src = data.image_url;
                studentImg.style.display = 'block';
            } else {
                studentImg.style.display = 'none';
            }
        } else {
            resultBox.style.backgroundColor = '#fce8e6';
            resultBox.style.border = '2px solid #ea4335';
            resultTitle.innerHTML = data.message;
            resultTitle.style.color = '#c5221f';
            studentName.innerText = '-';
            studentStatus.innerText = '-';
            studentImg.style.display = 'none';
        }
    })
    .catch(err => {
        alert('ເກີດຂໍ້ຜິດພາດໃນການເຊື່ອມຕໍ່ລະບົບ!');
        restartScanner();
    });
}

function restartScanner() {
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('qr-input-file').value = ""; 
}
</script>
{% endblock %}
