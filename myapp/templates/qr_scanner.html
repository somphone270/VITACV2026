{% extends 'components/base.html' %} 
{% load static %} 

{% block site_title %}ຄົ້ນຫາກວດສອບ | VVC{% endblock %} 

{% block content %} 
<div style="max-width: 600px; margin: 30px auto; padding: 20px; font-family: 'Noto Sans Lao', sans-serif;"> 
    <div style="background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center;"> 
        
        <h2 style="color: #2c3e50; margin-bottom: 5px; font-size: 22px;">🔍 ລະບົບຄົ້ນຫາກວດສອບການລົງທະບຽນ</h2> 
        <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 25px;">输入编号 verify 登记信息</p> 

        <!-- ຟອມສໍາລັບປ້ອນລະຫັດ -->
        <form id="search-form" onsubmit="searchRegistration(event)" style="margin: 10px auto; max-width: 400px; text-align: left;">
            <div style="margin-bottom: 15px;">
                <label for="reg-code-input" style="display: block; font-size: 14px; font-weight: bold; color: #34495e; margin-bottom: 8px;">
                    ປ້ອນລະຫັດການລົງທະບຽນ:
                </label>
                <input type="text" id="reg-code-input" placeholder="ຕົວຢ່າງ: VITA-XXXX" required
                    style="width: 100%; padding: 14px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; outline: none; transition: border-color 0.2s;">
            </div>
            
            <button type="submit" style="width: 100%; padding: 16px; background-color: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(0,123,255,0.2); display: flex; align-items: center; justify-content: center; gap: 10px;"> 
                🔍 ກວດສອບຂໍ້ມູນ (查询)
            </button>
        </form>

        <!-- ຫຼອດໂຫຼດເວລາປະມວນຜົນ --> 
        <div id="loading-status" style="display: none; margin-top: 15px; color: #007bff; font-weight: bold; font-size: 14px;"> 
            ⏳ ກຳລັງຄົ້ນຫາ ແລະ ປະມວນຜົນຂໍ້ມູນ... 
        </div> 

        <!-- ກ່ອງສະແດງຜົນການກວດສອບ --> 
        <div id="result-box" style="display: none; margin-top: 25px; padding: 25px; border-radius: 12px; text-align: left; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); transition: all 0.3s;"> 
            <h3 id="result-title" style="margin-top: 0; text-align: center; font-size: 18px; font-weight: bold;"></h3> 
            
            <div style="display: flex; gap: 20px; align-items: center; margin-top: 20px; background: rgba(255,255,255,0.7); padding: 15px; border-radius: 8px;"> 
                <img id="student-img" src="" style="width: 100px; height: 130px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; display: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1);"> 
                <div style="font-size: 15px; color: #333; line-height: 1.8;"> 
                    <p style="margin: 5px 0;"><strong>ຊື່ ແລະ ນາມສະກຸນ:</strong> <span id="student-name" style="color: #000; font-weight: 500;"></span></p> 
                    <p style="margin: 5px 0;"><strong>ສະຖານະ:</strong> <span id="student-status" style="color: #000; font-weight: 500;"></span></p> 
                </div> 
            </div> 

            <button onclick="clearSearch()" style="width: 100%; margin-top: 20px; padding: 12px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; box-shadow: 0 4px 10px rgba(108,117,125,0.2);"> 
                🔄 ລ້າງຂໍ້ມູນຄົ້ນຫາໃໝ່ 
            </button> 
        </div> 

    </div> 
</div> 

<script>
// ເອົາເອັບເຟັກ Focus ໃຫ້ກ່ອງ Input ເບິ່ງງາມຂຶ້ນ
const inputField = document.getElementById('reg-code-input');
inputField.addEventListener('focus', () => inputField.style.borderColor = '#007bff');
inputField.addEventListener('blur', () => inputField.style.borderColor = '#cbd5e1');

function searchRegistration(event) {
    event.preventDefault(); // ປ້ອງກັນບໍ່ໃຫ້ໜ້າເວັບ Reload
    
    const registrationId = inputField.value.trim();
    if (!registrationId) return;

    const loadingStatus = document.getElementById('loading-status');
    const resultBox = document.getElementById('result-box');
    
    loadingStatus.style.display = 'block';
    resultBox.style.display = 'none';

    // ເອີ້ນໃຊ້ Django API ຕົວເດີມຂອງທ່ານ
    fetch(`/api/check-reg/${registrationId}/`) 
        .then(response => response.json()) 
        .then(data => { 
            loadingStatus.style.display = 'none'; 
            
            let resultTitle = document.getElementById('result-title'); 
            let studentName = document.getElementById('student-name'); 
            let studentStatus = document.getElementById('student-status'); 
            let studentImg = document.getElementById('student-img'); 
            
            resultBox.style.display = 'block'; 

            if (data.success) { 
                resultBox.style.backgroundColor = '#e6f4ea'; 
                resultBox.style.border = '2px solid #34a853'; 
                resultTitle.innerHTML = '✅ ກວດສອບຜ່ານ (Verification Passed)'; 
                resultTitle.style.color = '#137333'; 
                studentName.innerText = data.name; 
                studentStatus.innerText = data.status; 
                
                if (data.image_url) { 
                    studentImg.src = data.image_url; 
                    studentImg.style.display = 'block'; 
                } else { 
                    studentImg.style.display = 'none'; 
                } 
            } else { 
                resultBox.style.backgroundColor = '#fce8e6'; 
                resultBox.style.border = '2px solid #ea4335'; 
                resultTitle.innerHTML = data.message || '❌ ບໍ່ພົບຂໍ້ມູນລະຫັດນີ້ໃນລະບົບ'; 
                resultTitle.style.color = '#c5221f'; 
                studentName.innerText = '-'; 
                studentStatus.innerText = '-'; 
                studentImg.style.display = 'none'; 
            } 
        }) 
        .catch(err => { 
            loadingStatus.style.display = 'none';
            alert('ເກີດຂໍ້ຜິດພາດໃນການເຊື່ອມຕໍ່ລະບົບ!'); 
            clearSearch();
        }); 
}

function clearSearch() { 
    document.getElementById('result-box').style.display = 'none'; 
    inputField.value = ""; 
    inputField.focus();
}
</script> 
{% endblock %}
